name: Test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go test -race ./...
      - name: Cross-compile check (windows/amd64)
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -o /dev/null ./cmd/q38fninference

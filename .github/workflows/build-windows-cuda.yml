name: Release (Windows, CUDA)

# Builds llama.cpp with CUDA plus the launcher for Windows x64 and, on a
# v* tag, publishes them as a GitHub release. The llama.cpp jobs copy
# ggml-org/llama.cpp's own release.yml (windows-cpu + windows-cuda) at the
# pinned commit: llama-server.exe and the CPU backends are built once with
# clang, and CUDA ships as a dynamically loaded ggml-cuda.dll built with
# MSVC/nvcc, then both are merged into one folder.
#
# Releases are cut by pushing a v* tag, or by pushing a commit whose message
# contains "[release]": the workflow then tags that commit v$(cat VERSION)
# itself, for setups that can push branches but not tags.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      llama_cpp_ref:
        description: "llama.cpp commit/tag to build (the patch is verified against the default)"
        required: false
        default: ""

env:
  # patches/*.patch are verified against this commit; bump both together
  LLAMA_CPP_REF: ${{ github.event.inputs.llama_cpp_ref || '6c7a87f7e5e5cd75b8a641c3471f2dee84a6ed17' }}
  CMAKE_ARGS: "-DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON"

permissions:
  contents: read

jobs:
  llama-cpu:
    name: llama.cpp base (llama-server + CPU backends)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6
        with:
          path: launcher
      - uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ env.LLAMA_CPP_REF }}
          path: llama.cpp
          fetch-depth: 0 # build-info needs the commit count

      - name: Apply patches
        shell: bash
        working-directory: llama.cpp
        run: for p in ../launcher/patches/*.patch; do git apply --verbose "$p"; done

      - name: Install Ninja
        run: choco install ninja -y

      - name: Build
        shell: cmd
        working-directory: llama.cpp
        run: |
          call "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -D CMAKE_TOOLCHAIN_FILE=cmake/x64-windows-llvm.cmake ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_CPU_ALL_VARIANTS=ON ^
            -DGGML_OPENMP=ON ^
            -DGGML_OPENMP_FETCH=ON ^
            ${{ env.CMAKE_ARGS }}
          cmake --build build --config Release
          copy LICENSE build\bin\Release\LICENSE-llama.cpp.txt

      - uses: actions/upload-artifact@v6
        with:
          name: llama-cpu
          path: llama.cpp/build/bin/Release/*
          if-no-files-found: error

  llama-cuda:
    name: llama.cpp CUDA backend (ggml-cuda.dll)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          path: launcher
      - uses: actions/checkout@v6
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ env.LLAMA_CPP_REF }}
          path: llama.cpp

      - name: Apply patches
        shell: bash
        working-directory: llama.cpp
        run: for p in ../launcher/patches/*.patch; do git apply --verbose "$p"; done

      - name: Install CUDA Toolkit
        uses: ./llama.cpp/.github/actions/windows-setup-cuda
        with:
          cuda_version: "12.4"
          cuda_arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Build
        shell: cmd
        working-directory: llama.cpp
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CPU=OFF ^
            -DGGML_CUDA=ON ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            -DGGML_CUDA_CUB_3DOT2=ON
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS% --target ggml-cuda

      - name: Collect ggml-cuda.dll + CUDA runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item llama.cpp\build\bin\Release\ggml-cuda.dll out\
          foreach ($d in "$env:CUDA_PATH\bin", "$env:CUDA_PATH\bin\x64") {
            if (Test-Path $d) { Copy-Item "$d\cudart64_*.dll", "$d\cublas64_*.dll", "$d\cublasLt64_*.dll" out\ -ErrorAction SilentlyContinue }
          }
          if (-not (Test-Path out\cudart64_*.dll)) { throw "CUDA runtime DLLs not found under $env:CUDA_PATH" }
          Get-ChildItem out

      - uses: actions/upload-artifact@v6
        with:
          name: llama-cuda
          path: out/*
          if-no-files-found: error

  launcher:
    name: Launcher (Go)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
      - run: go vet ./... && go test -race ./...
      - name: Build Windows GUI exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-H windowsgui -s -w" -o q38fninference.exe ./cmd/q38fninference
      - uses: actions/upload-artifact@v6
        with:
          name: launcher
          path: q38fninference.exe
          if-no-files-found: error

  package:
    name: Package
    needs: [llama-cpu, llama-cuda, launcher]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: llama-cpu
          path: dist/Q38FNInference
      - uses: actions/download-artifact@v7
        with:
          name: llama-cuda
          path: dist/Q38FNInference
      - uses: actions/download-artifact@v7
        with:
          name: launcher
          path: dist/Q38FNInference

      - name: Assemble
        run: |
          set -eu
          d=dist/Q38FNInference
          test -f "$d/llama-server.exe" && test -f "$d/ggml-cuda.dll" && test -f "$d/q38fninference.exe"
          cp LICENSE "$d/LICENSE.txt"
          cat > "$d/README.txt" <<'EOF'
          Q38FNInference - Qwen3.8-Flash-Next launcher (Windows, NVIDIA CUDA)

          1. Run q38fninference.exe. The control panel opens in your browser
             (http://127.0.0.1:8787). Running it again just reopens the panel.
          2. Models tab: pick a local GGUF or download one from Hugging Face.
          3. Run tab: check the GPU selection and launch plan, then Start.
          4. Chat tab, or llama.cpp's web UI and the OpenAI-compatible API at
             http://127.0.0.1:8080/v1 (streaming and non-streaming).
          5. Quit (top right) stops the model and exits.

          Requires an NVIDIA driver supporting CUDA 12.4 (R550 or newer).
          Settings and launcher.log live in %APPDATA%\Q38FNInference.
          Downloaded models go to %APPDATA%\Q38FNInference\models.
          EOF
          sed -i 's/$/\r/' "$d/README.txt"
          ls -la "$d"
          (cd dist && zip -r -9 ../Q38FNInference-windows-x64-cuda12.zip Q38FNInference)
          cp "$d/q38fninference.exe" q38fninference.exe
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; else tag="v$(tr -d '[:space:]' < VERSION)"; fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v6
        with:
          name: Q38FNInference-windows-x64-cuda12
          path: Q38FNInference-windows-x64-cuda12.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Q38FNInference ${{ env.TAG }}
          body: |
            Windows x64 build with NVIDIA CUDA 12.4 (driver R550+).

            **Download `Q38FNInference-windows-x64-cuda12.zip`**, extract it anywhere, and run `q38fninference.exe` — the control panel opens in your browser.
            It contains the launcher plus llama.cpp (`llama-server.exe`, CPU backends, `ggml-cuda.dll`, CUDA runtime) built from ggml-org/llama.cpp@${{ env.LLAMA_CPP_REF }} with this repo's patches.

            `q38fninference.exe` on its own is only the launcher; it needs `llama-server.exe` next to it (or its path set in Settings).
          files: |
            Q38FNInference-windows-x64-cuda12.zip
            q38fninference.exe
          fail_on_unmatched_files: true
